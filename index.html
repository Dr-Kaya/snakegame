<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Classic Arcade Fun!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐍 SNAKE GAME</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">High Score:</span>
                    <span id="highScore" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </div>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div id="gameOver" class="game-over hidden">
                <h2>Game Over!</h2>
                <p>Your Score: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">Play Again</button>
            </div>

            <div id="startScreen" class="start-screen">
                <h2>Welcome to Snake!</h2>
                <div class="instructions">
                    <p>🎮 Use Arrow Keys or WASD to move</p>
                    <p>🍎 Eat food to grow and score points</p>
                    <p>⚡ Speed increases every 5 points</p>
                    <p>💀 Don't hit walls or yourself!</p>
                </div>
                <button id="startBtn" class="btn btn-start">Start Game</button>
            </div>
        </div>

        <div class="controls">
            <p>Controls: Arrow Keys or WASD | Pause: SPACE</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
